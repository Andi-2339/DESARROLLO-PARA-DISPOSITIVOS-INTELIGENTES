@if (!authService.loading()) {
  @if (showUI()) {
    <app-popup-banner></app-popup-banner>
    <app-header></app-header>
  }
  
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  @if (showUI()) {
    <app-footer></app-footer>
  }
} @else {
  <div class="loading-screen">
    <div class="loader"></div>
  </div>
}
